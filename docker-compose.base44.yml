services:
  db:
    image: mysql:8
    environment:
      - MYSQL_DATABASE=cartverse
      - MYSQL_USER=cartverse
      - MYSQL_PASSWORD=cartverse
      - MYSQL_ROOT_PASSWORD=rootcartverse
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootcartverse"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql

  deps:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: npm install

  migrate:
    image: node:22
    working_dir: /app
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://cartverse:cartverse@db:3306/cartverse
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "npx prisma generate &&
             npx prisma db push --accept-data-loss &&
             node server/scripts/seed.js"

  api:
    image: node:22
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: node --watch server/server.js

  web:
    image: node:22
    working_dir: /app
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      - VITE_API_PROXY_TARGET=http://api:5000
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  dbdata:
  node_modules:
