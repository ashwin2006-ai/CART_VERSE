services:
  - type: web
    name: cartverse-api
    env: node
    region: oregon
    plan: free
    
    # Build configuration
    buildCommand: npm install
    startCommand: npm run start:prod
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cartverse-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://your-frontend-domain.com
      - key: FLIPKART_AFFILIATE_ID
        sync: false
      - key: FLIPKART_AFFILIATE_TOKEN
        sync: false
      - key: FLIPKART_API_BASE_URL
        value: https://affiliate-api.flipkart.net/affiliate/1.0

  - type: postgresql
    name: cartverse-db
    region: oregon
    plan: free
    databaseName: cartverse
    user: postgres

databases:
  - name: cartverse-db
    databaseName: cartverse
    user: postgres
