version: '3.8'

services:
  # PostgreSQL Database (replaces MySQL)
  db:
    image: postgres:16-alpine
    container_name: cartverse-db
    environment:
      POSTGRES_DB: cartverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cartverse

  # Node.js Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartverse-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cartverse?schema=public
      JWT_SECRET: dev_jwt_secret_key_change_in_production
      CORS_ORIGIN: http://localhost:3000
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - /app/node_modules
    command: npm run dev:server
    networks:
      - cartverse

volumes:
  postgres_data:
    driver: local

networks:
  cartverse:
    driver: bridge
